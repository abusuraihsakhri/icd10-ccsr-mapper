name: Python tests and browser syntax
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q ccsr_mapper.py cli.py agents tests
      - run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text()
          match = re.search(r"<script>([\s\S]*?)</script>", html)
          assert match, "Missing browser code"
          Path("/tmp/ccsr-web.js").write_text(match.group(1))
          PY
          node --check /tmp/ccsr-web.js
